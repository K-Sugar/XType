# Generated by xtype-settings — manual edits are preserved across sessions but inline comments are not.

[inference]
model = "qwen2.5:1.5b"
ollama_host = "http://localhost:11434"
debounce_ms = 220
min_context_chars = 10
context_window = 150
num_predict = 30
temperature = 0.3
top_p = 0.9
stop_tokens = [".", "!", "?", "\n"]

[behaviour]
engine_enabled = true
trigger_mode = "pause"
accept_full_key = "tab"
tab_accepts_word = false
blocklist_apps = ["konsole", "alacritty", "keepassxc", "1password", "bitwarden", "gnome-keyring", "seahorse"]
blocked_phrases = []

[learning]
enabled = false
corpus_path = "~/.local/share/xtype/corpus.txt"
flush_interval_sec = 60
max_corpus_mb = 50
min_sentence_chars = 12
include_examples_in_prompt = true

[user_prompt]
description = ""
tone = ""
avoid_phrases = []
